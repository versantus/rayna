# Generate the Xcode project with:  cd iOS && xcodegen generate
name: Rayna
options:
  bundleIdPrefix: co.versantus.rayna
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: N5SR9X6F96
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  RaynaCore:
    path: ..
targets:
  Rayna:
    type: application
    platform: iOS
    sources:
      - Rayna
      - Shared
    dependencies:
      - package: RaynaCore
        product: RaynaCore
      - target: RaynaWidgetExtension
    entitlements:
      path: Rayna/Rayna.entitlements
      properties:
        com.apple.security.application-groups: [group.co.versantus.rayna]
    info:
      path: Rayna/Info.plist
      properties:
        CFBundleDisplayName: Rayna
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.versantus.rayna.ios
        PRODUCT_NAME: Rayna
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  RaynaWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - RaynaWidget
      - Shared
    dependencies:
      - package: RaynaCore
        product: RaynaCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: RaynaWidget/RaynaWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.co.versantus.rayna]
    info:
      path: RaynaWidget/Info.plist
      properties:
        CFBundleDisplayName: Rayna
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.versantus.rayna.ios.widget
        PRODUCT_NAME: RaynaWidgetExtension
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
schemes:
  Rayna:
    build:
      targets:
        Rayna: all
        RaynaWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
