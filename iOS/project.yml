# Generate the Xcode project with:  cd iOS && xcodegen generate
name: Rayna
options:
  bundleIdPrefix: co.versantus.rayna
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: F9MJXEKGAR
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  RaynaCore:
    path: ..
targets:
  Rayna:
    type: application
    platform: iOS
    sources:
      - Rayna
      - Shared
      - WatchShared
    dependencies:
      - package: RaynaCore
        product: RaynaCore
      - target: RaynaWidgetExtension
      - target: RaynaWatch
    entitlements:
      path: Rayna/Rayna.entitlements
      properties:
        com.apple.security.application-groups: [group.co.versantus.raynawater]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.icloud-container-identifiers: [iCloud.co.versantus.raynawater]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    info:
      path: Rayna/Info.plist
      properties:
        NSHealthShareUsageDescription: Rayna reads today's running workouts to add your run-day water bonus automatically.
        NSHealthUpdateUsageDescription: Rayna can save each glass you log as Dietary Water in Apple Health.
        CKSharingSupported: true
        NSSupportsLiveActivities: true
        UIBackgroundModes: [remote-notification]
        CFBundleDisplayName: Rayna
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.versantus.raynawater.ios
        PRODUCT_NAME: Rayna
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  RaynaWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - RaynaWidget
      - Shared
    dependencies:
      - package: RaynaCore
        product: RaynaCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: RaynaWidget/RaynaWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.co.versantus.raynawater]
    info:
      path: RaynaWidget/Info.plist
      properties:
        CFBundleDisplayName: Rayna
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.versantus.raynawater.ios.widget
        PRODUCT_NAME: RaynaWidgetExtension
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
  RaynaWatch:
    type: application
    platform: watchOS
    sources:
      - RaynaWatch
      - WatchShared
    dependencies:
      - target: RaynaWatchWidget
    entitlements:
      path: RaynaWatch/RaynaWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.co.versantus.raynawater]
    info:
      path: RaynaWatch/Info.plist
      properties:
        CFBundleDisplayName: Rayna
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: co.versantus.raynawater.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.versantus.raynawater.ios.watchkitapp
        PRODUCT_NAME: RaynaWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
  RaynaWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - RaynaWatchWidget
      - WatchShared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: RaynaWatchWidget/RaynaWatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.co.versantus.raynawater]
    info:
      path: RaynaWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Rayna
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.versantus.raynawater.ios.watchkitapp.widget
        PRODUCT_NAME: RaynaWatchWidget
        SKIP_INSTALL: YES
schemes:
  Rayna:
    build:
      targets:
        Rayna: all
        RaynaWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
